<div class="page">
    <main class="card">

        <!-- Кнопка «Назад» -->
        <header class="event-header">
            <a routerLink="/" class="back-btn" aria-label="Назад">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
            </a>
            <span class="event-header__title">Событие</span>
            <span class="event-header__spacer"></span>
        </header>

        <!-- Вертикальная афиша -->
        <div class="poster">
            <img [src]="event.poster" [alt]="event.title" />
        </div>

        <!-- Заголовок и дата -->
        <div class="event-title-block">
            <h1 class="event-title">{{ event.title }}</h1>

            <div class="event-meta">
                <div class="meta-badge">
                    <span class="meta-day">{{ event.day }}</span>
                    <span class="meta-month">{{ event.month }}</span>
                </div>
                <div class="meta-info">
                    <span class="meta-weekday">{{ event.weekday }}</span>
                    <span class="meta-time">Начало в {{ event.time }}</span>
                </div>
            </div>
        </div>

        <!-- Анонс -->
        <div class="event-description">
            <p>{{ event.description }}</p>
        </div>

        <!-- Дополнительная информация -->
        <div class="event-details">
            <div class="detail-row">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                    <circle cx="12" cy="10" r="3" />
                </svg>
                <span>{{ event.address }}</span>
            </div>
            <div class="detail-row">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
                    <line x1="12" y1="18" x2="12" y2="22" />
                    <line x1="12" y1="2" x2="12" y2="6" />
                </svg>
                <span>Вход: <strong>{{ event.price }}</strong></span>
            </div>
        </div>
    </main>
</div>
